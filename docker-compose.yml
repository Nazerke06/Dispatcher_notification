version: '3.9'

services:
  db:
    image: postgres:16
    container_name: report_db
    environment:
      POSTGRES_DB: report
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: report_app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/report
      SPRING_DATASOURCE_USERNAME: report
      SPRING_DATASOURCE_PASSWORD: report